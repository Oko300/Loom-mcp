<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" fill="#0d1117"/>
  <!-- Header -->
  <rect width="1200" height="48" fill="#161b22"/>
  <rect x="0" y="47" width="1200" height="1" fill="#30363d"/>
  <text x="20" y="30" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">🧵 <tspan fill="#6366f1">Loom</tspan></text>
  <rect x="1070" y="12" width="118" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <circle cx="1085" cy="24" r="4" fill="#30363d"/>
  <text x="1095" y="29" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Setup required</text>
  <!-- Connect icon + title -->
  <text x="600" y="145" font-family="system-ui,sans-serif" font-size="44" text-anchor="middle">🔌</text>
  <text x="600" y="195" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">Connect your workspace</text>
  <text x="600" y="220" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Loom needs the FlowDev VS Code extension to read your project</text>
  <text x="600" y="237" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">and build your memory. One-time setup — takes about 2 minutes.</text>
  <!-- Setup card -->
  <rect x="370" y="262" width="460" height="230" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="394" y="288" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="0.5">SETUP STEPS</text>
  <!-- Step 1 -->
  <circle cx="406" cy="313" r="10" fill="#6366f1"/>
  <text x="406" y="318" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="424" y="310" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Get a free token at </text>
  <text x="424" y="326" font-family="system-ui,sans-serif" font-size="13" fill="#6366f1">flowdev.onrender.com/login</text>
  <!-- Step 2 -->
  <circle cx="406" cy="358" r="10" fill="#6366f1"/>
  <text x="406" y="363" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="424" y="355" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Install </text>
  <text x="469" y="355" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">FlowDev MCP</text>
  <text x="574" y="355" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e"> from VS Code Marketplace</text>
  <!-- Step 3 -->
  <circle cx="406" cy="398" r="10" fill="#6366f1"/>
  <text x="406" y="403" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="424" y="395" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Paste token in VS Code → FlowDev sidebar → click </text>
  <text x="424" y="411" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Connect</text>
  <!-- Step 4 -->
  <circle cx="406" cy="440" r="10" fill="#6366f1"/>
  <text x="406" y="445" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="424" y="437" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Anna → Loom → </text>
  <text x="533" y="437" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Settings → Credentials</text>
  <text x="424" y="453" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">→ add FlowDev token</text>
  <!-- Button -->
  <rect x="503" y="516" width="194" height="38" rx="6" fill="#6366f1"/>
  <text x="600" y="541" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Check Connection</text>
  <text x="600" y="578" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Your token is stored securely in Anna's credential vault</text>
</svg>
