  <text x="74" y="456" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Node.js executa over Python for Socket.IO ecosystem</text>
  <text x="58" y="476" font-family="system-ui,sans-serif" font-size="13" fill="#30363d">—</text>
  <text x="74" y="476" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">FlowDev relay as VS Code bridge (not direct LSP)</text>
  <text x="58" y="496" font-family="system-ui,sans-serif" font-size="13" fill="#30363d">—</text>
  <text x="74" y="496" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Anna KV storage for persistent memory (key: loom:memory)</text>
  <text x="58" y="516" font-family="system-ui,sans-serif" font-size="13" fill="#30363d">—</text>
  <text x="74" y="516" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">Anna LLM sampling for memory generation and chat</text>
